
name: Проверка, сборка и выпуск

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.editorconfig'

  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.editorconfig'

  workflow_dispatch:

# Отменяем устаревшие проверки, но не релизные сборки.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  test:
    name: Модульные тесты
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Запустить тесты
        run: dotnet test tests/StudentPassportMonitor.Tests/StudentPassportMonitor.Tests.csproj --configuration Release

  build:
    name: Сборка Windows
    runs-on: windows-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Проверить соответствие версии тегу
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $props = [xml](Get-Content Directory.Build.props)
          $version = $props.Project.PropertyGroup.VersionPrefix

          if ($version -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Неверный формат версии: $version"
          }

          if ($tag -cne "v$version") {
            throw "Тег $tag не соответствует версии $version"
          }

      - name: Собрать приложение
        run: dotnet build src/StudentPassportMonitor.Wpf/StudentPassportMonitor.Wpf.csproj --configuration Release

      # Публикация и установщик нужны только для релиза.
      - name: Опубликовать автономную сборку
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          dotnet publish src/StudentPassportMonitor.Wpf/StudentPassportMonitor.Wpf.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            --output artifacts/publish

      - name: Установить Inno Setup
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Собрать установщик
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $props = [xml](Get-Content Directory.Build.props)
          $version = $props.Project.PropertyGroup.VersionPrefix
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $iscc)) {
            throw "Компилятор Inno Setup не найден"
          }

          & $iscc `
            "/DAppVersion=$version" `
            "/DAppExe=StudentPassportMonitor.Wpf.exe" `
            "/DPublishDir=$((Resolve-Path artifacts/publish).Path)" `
            "/DOutputDir=$((Join-Path $PWD 'artifacts/installer'))" `
            installer/StudentPassportMonitor.iss

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          Get-ChildItem artifacts/installer/*.exe |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object {
              "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))"
            } |
            Set-Content artifacts/installer/SHA256SUMS.txt

      - name: Загрузить установщик
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: student-passport-monitor-installer
          path: |
            artifacts/installer/*.exe
            artifacts/installer/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Опубликовать релиз GitHub
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: student-passport-monitor-installer
          path: release

      - name: Создать релиз
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
